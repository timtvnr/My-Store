<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>@voltixshop38 · Trottinettes &amp; Tech — TikTok Shop</title>
  <meta name="description" content="Ma sélection de trottinettes électriques et produits tech en vente sur TikTok Shop. Liens sponsorisés." />
  <meta name="theme-color" content="#050507" />
  <!-- Open Graph (à personnaliser) -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="@voltixshop38 · Trottinettes &amp; Tech — TikTok Shop" />
  <meta property="og:description" content="Ma sélection de trottinettes électriques et produits tech en vente sur TikTok Shop." />
  <meta property="og:url" content="https://timtvnr.github.io/My-Store/" />
  <meta property="og:image" content="https://p16-common-sign.tiktokcdn-eu.com/tos-useast2a-avt-0068-euttp/29864830bfc008c3f25afcc9c87a3f75~tplv-tiktokx-cropcenter:1080:1080.jpeg?dr=10399&amp;refresh_token=364189ca&amp;x-expires=1795777200&amp;x-signature=OFct5%2Fi7qFnzM7A5E1nkvM2scSM%3D&amp;t=4d5b0474&amp;ps=13740610&amp;shp=a5d48078&amp;shcp=81f88b70&amp;idc=useast2b" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet" />

  <style>
    /* =========================================
       CONFIGURATION — éditez les couleurs ici
       ========================================= */
    :root {
      --bg: #050507;               /* fond quasi noir */
      --surface: #0d0d14;          /* surface des cartes */
      --surface-2: #14141d;        /* surface secondaire */
      --accent: #00f2ff;           /* cyan électrique — couleur d'accent unique */
      --accent-rgb: 0, 242, 255;
      --text: #f8fafc;             /* texte principal */
      --text-muted: #94a3b8;       /* texte secondaire */
      --border: #1e1e26;           /* bordures */
      --radius: 16px;
      --transition: 250ms ease;
      --font: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: clamp(15px, 1.1vw, 17px);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    img { display: block; max-width: 100%; height: auto; }
    a { color: inherit; text-decoration: none; }

    /* ===================== HERO ===================== */
    .hero {
      position: relative;
      padding: clamp(40px, 10vh, 80px) clamp(20px, 5vw, 32px);
      text-align: center;
      min-height: 70vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .hero::before {
      content: "";
      position: absolute;
      inset: -10%;
      background:
        radial-gradient(circle at 25% 30%, rgba(var(--accent-rgb), 0.10), transparent 45%),
        radial-gradient(circle at 75% 70%, rgba(var(--accent-rgb), 0.05), transparent 45%);
      animation: bgFloat 10s ease-in-out infinite alternate;
      z-index: -1;
    }
    .hero .profile {
      width: clamp(80px, 18vw, 130px);
      height: clamp(80px, 18vw, 130px);
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--border);
      box-shadow: 0 0 0 0 rgba(var(--accent-rgb), 0);
      animation: ringPulse 3s ease-in-out infinite;
      margin-bottom: 18px;
    }
    .hero h1 { font-size: clamp(1.8rem, 4vw, 2.6rem); font-weight: 800; letter-spacing: -0.02em; margin-bottom: 8px; }
    .hero .tagline { color: var(--text-muted); font-size: clamp(1rem, 2.5vw, 1.25rem); margin-bottom: 30px; max-width: 34ch; }

    /* ===================== BOUTONS ===================== */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 26px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 1rem;
      border: none;
      cursor: pointer;
      font-family: inherit;
      transition: transform var(--transition), box-shadow var(--transition), opacity var(--transition), border-color var(--transition);
      text-align: center;
    }
    .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    .btn-primary {
      background: var(--accent);
      color: #050507;
      box-shadow: 0 0 20px rgba(var(--accent-rgb), 0.25);
      animation: pulse 2.5s ease-in-out infinite;
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 0 32px rgba(var(--accent-rgb), 0.45); }
    .btn-outline {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }
    .btn-outline:hover { border-color: var(--accent); color: var(--accent); }

    /* ===================== PRODUITS ===================== */
    section { padding: 40px clamp(20px, 5vw, 32px); }
    .section-title { text-align: center; font-size: clamp(1.5rem, 3vw, 1.9rem); font-weight: 700; margin-bottom: 34px; letter-spacing: -0.01em; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 22px;
      max-width: 900px;
      margin: 0 auto;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform var(--transition), box-shadow var(--transition), border-color var(--transition);
      opacity: 0;
      transform: translateY(18px);
    }
    .card.is-visible { opacity: 1; transform: none; }
    .card img {
      width: 100%;
      height: 240px;
      object-fit: cover;
      background: var(--surface-2);
    }
    .card-body { padding: 18px 20px 22px; display: flex; flex-direction: column; gap: 10px; }
    .card h3 { font-size: 1.05rem; font-weight: 600; margin: 0; }
    .card .price { color: var(--accent); font-weight: 700; font-size: 1.05rem; }
    .card .btn { width: 100%; padding: 12px; font-size: 0.95rem; margin-top: 6px; }
    .card:hover { transform: translateY(-6px) scale(1.02); border-color: var(--accent); box-shadow: 0 14px 34px rgba(0,0,0,0.35), 0 0 24px rgba(var(--accent-rgb), 0.18); }
    .card:hover .btn { box-shadow: 0 0 16px rgba(var(--accent-rgb), 0.35); }

    /* ===================== MENTION SPONSORING ===================== */
    .disclosure {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
      max-width: 640px;
      margin: 8px auto 34px;
      line-height: 1.7;
    }
    .disclosure b { color: var(--text); }

    /* ===================== CTA TIKTOK ===================== */
    .cta { text-align: center; padding: 0 clamp(20px, 5vw, 32px) 70px; }

    /* ===================== ANIMATIONS ===================== */
    @keyframes bgFloat { from { transform: translate(0, 0) scale(1); } to { transform: translate(16px, 32px) scale(1.03); } }
    @keyframes pulse { 0%, 100% { opacity: 1; box-shadow: 0 0 20px rgba(var(--accent-rgb), 0.25); } 50% { opacity: 0.9; box-shadow: 0 0 32px rgba(var(--accent-rgb), 0.45); } }
    @keyframes ringPulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(var(--accent-rgb), 0.5); } 50% { box-shadow: 0 0 0 8px rgba(var(--accent-rgb), 0.15); } }

    /* Respecte prefers-reduced-motion */
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
      .card { opacity: 1; transform: none; }
    }

    .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); border: 0; white-space: nowrap; }
  </style>
</head>
<body>

  <!-- ===================== HERO ===================== -->
  <header class="hero reveal" id="hero">
    <!-- Remplacez l'URL ci-dessous par votre photo de profil -->
    <img src="https://p16-common-sign.tiktokcdn-eu.com/tos-useast2a-avt-0068-euttp/29864830bfc008c3f25afcc9c87a3f75~tplv-tiktokx-cropcenter:1080:1080.jpeg?dr=10399&amp;refresh_token=364189ca&amp;x-expires=1795777200&amp;x-signature=OFct5%2Fi7qFnzM7A5E1nkvM2scSM%3D&amp;t=4d5b0474&amp;ps=13740610&amp;shp=a5d48078&amp;shcp=81f88b70&amp;idc=useast2b" alt="Photo de profil de @voltixshop38" class="profile" width="130" height="130" loading="eager" />
    <h1>@voltixshop38</h1>
    <p class="tagline">Trottinettes électriques &amp; produits tech — mes sélections TikTok Shop</p>
    <a href="#produits" class="btn btn-primary">Voir les produits</a>
  </header>

  <!-- ===================== PRODUITS ===================== -->
  <section id="produits" aria-labelledby="produits-title">
    <h2 id="produits-title" class="section-title reveal">Mes produits en vente</h2>
    <div class="grid" id="grid"></div>
  </section>

  <p class="disclosure reveal">
    <b>Liens sponsorisés / affiliés TikTok Shop.</b> Je peux être rémunéré si tu achètes via ces liens.
  </p>

  <!-- ===================== CTA TIKTOK ===================== -->
  <div class="cta reveal">
    <a href="https://www.tiktok.com/@voltixshop38" class="btn btn-outline" target="_blank" rel="noopener">Mon compte TikTok <span aria-hidden="true">→</span></a>
  </div>

  <script>
    /* =========================================
       DONNÉES — ajoutez un produit en copiant une ligne
       { nom, prix, image, lien }
       ========================================= */
    const PRODUITS = [
      { nom: "Trottinette électrique urbaine", prix: "349 €", image: "https://via.placeholder.com/400x400?text=Trottinette+1", lien: "https://www.tiktok.com/shop" },
      { nom: "Casque sans fil réducteur de bruit", prix: "179 €", image: "https://via.placeholder.com/400x400?text=Casque+Tech", lien: "https://www.tiktok.com/shop" },
      { nom: "Support téléphone guidon", prix: "24 €", image: "https://via.placeholder.com/400x400?text=Accessoire", lien: "https://www.tiktok.com/shop" },
    ];

    /* =========================================
       Rendu de la grille de produits
       ========================================= */
    const grid = document.getElementById("grid");
    PRODUITS.forEach((produit, index) => {
      const article = document.createElement("article");
      article.className = "card reveal";
      article.style.transitionDelay = `${index * 60}ms`;
      article.innerHTML = `
        <img src="${produit.image}" alt="${produit.nom}" loading="lazy" decoding="async" width="400" height="400" />
        <div class="card-body">
          <h3>${produit.nom}</h3>
          <p class="price">${produit.prix}</p>
          <a href="${produit.lien}" class="btn" target="_blank" rel="noopener sponsored">Voir sur TikTok Shop</a>
        </div>
      `;
      grid.appendChild(article);
    });

    /* =========================================
       Apparition au scroll : fondu + slide vers le haut
       ========================================= */
    const observer = new IntersectionObserver(
      (entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            entry.target.classList.add("is-visible");
            observer.unobserve(entry.target);
          }
        });
      },
      { threshold: 0.1 }
    );
    document.querySelectorAll(".reveal").forEach((el) => observer.observe(el));
  </script>
</body>
</html>
